name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - run: uv sync --all-extras
      - run: uv run ruff check src/ run_server.py --quiet
      - run: uv run ruff format src/ run_server.py --check --quiet
      # Typing gate: pyright-clean since the v0.4.0 stub-drift sprint.
      - run: uv run --with pyright -- pyright src/
      - run: bun install --frozen-lockfile
        working-directory: webapp
      - run: bun run biome:ci
        working-directory: webapp
      - run: bun run check
        working-directory: webapp
      - run: bun run build
        working-directory: webapp

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -q --cov=qcad_mcp --cov-fail-under=30
