name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync --all-extras
      - run: uv run ruff check src/ run_server.py --quiet
      - run: uv run ruff format src/ run_server.py --check --quiet
      # Non-blocking: 101 pre-existing third-party-stub errors (ezdxf private
      # imports, prefab_ui API drift) — needs a dedicated typing pass.
      # New code must be pyright-clean (verified in assfix Phase 3).
      - run: uv run --with pyright -- pyright src/
        continue-on-error: true
      - run: npm --prefix webapp ci && npm --prefix webapp run biome:ci
      - run: npm --prefix webapp ci && npm --prefix webapp run check
      - run: npm --prefix webapp ci && npm --prefix webapp run build

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -q --cov=qcad_mcp --cov-fail-under=30
