[project]
name = "qcad-mcp"
version = "0.3.0"
description = "QCAD 2D CAD automation: DXF/DWG floor plans to SVG and STL, via MCP tools and REST"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "ezdxf>=1.0",
    "numpy>=1.24",
    "numpy-stl>=3.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.23",
    "httpx>=0.27",
    "pydantic>=2.0",
    "beautifulsoup4>=4.14",
    "pillow>=12.2.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.0,<0.17",
]

[project.scripts]
qcad-mcp = "qcad_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcad_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "RUF", "T20"]
ignore = ["S101", "S106", "RUF012", "S603", "S607", "S324", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["E501"]
"src/qcad_mcp/server.py" = ["E501", "S603"]
"src/qcad_mcp/services/*.py" = ["S603", "S607"]
"tests/**/*.py" = ["E501", "S101", "T20"]
"scripts/**" = ["E501", "S310", "T20"]

[tool.coverage.run]
source = ["qcad_mcp"]
branch = true

[tool.coverage.report]
fail_under = 30
show_missing = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pywin32>=311",
]
