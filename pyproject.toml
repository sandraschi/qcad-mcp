[project]
name = "qcad-mcp"
version = "0.1.0"
description = "QCAD MCP server — DXF/DWG floor plans to SVG preview + STL extrusion via MCP tools and REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "ezdxf>=1.0",
    "numpy>=1.24",
    "numpy-stl>=3.0",
    "shapely>=2.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.23",
    "httpx>=0.27",
    "pydantic>=2.0",
    "beautifulsoup4>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcad_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501", "S101"]
